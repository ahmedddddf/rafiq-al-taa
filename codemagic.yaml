workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build with Accurate Quran Database
        script: |
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          if [ -d "rafiq" ]; then cd rafiq; fi
          
          # إنشاء قاعدة بيانات نصية ذكية داخل الكود
          MAIN_ACTIVITY_PATH=$(find . -name "MainActivity.kt" | head -n 1)
          rm -f "$MAIN_ACTIVITY_PATH"
          cat << 'EOF' > "$MAIN_ACTIVITY_PATH"
          package com.example
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.text.style.TextAlign
          
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      val surahData = mapOf(
                          "الفاتحة" to "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴿١﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَٰنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾",
                          "المائدة" to "يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ ۚ أُحِلَّتْ لَكُم بَهِيمَةُ الْأَنْعَامِ إِلَّا مَا يُتْلَىٰ عَلَيْكُمْ غَيْرَ مُحِلِّي الصَّيْدِ وَأَنتُمْ حُرُمٌ ۗ إِنَّ اللَّهَ يَحْكُمُ مَا يُرِيدُ ﴿١﴾",
                          "الملك" to "تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ﴿١﴾ الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ ﴿٢﴾"
                      )
                      
                      var currentSurah by remember { mutableStateOf("المائدة") }
                      
                      Surface(color = Color(0xFFFBF8F3), modifier = Modifier.fillMaxSize()) {
                          Column(modifier = Modifier.padding(16.dp)) {
                              Text(text = "سورة $currentSurah", style = MaterialTheme.typography.headlineMedium, color = Color(0xFF006644))
                              Spacer(modifier = Modifier.height(16.dp))
                              Card {
                                  Text(text = surahData[currentSurah] ?: "جاري التحميل...", modifier = Modifier.padding(16.dp))
                              }
                          }
                      }
                  }
              }
          }
          EOF
          ./gradlew clean assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
