workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Project and Build
        script: |
          unzip -o "*.zip" -d extracted_project
          
          # البحث عن المجلد الذي يحتوي على ملف البناء الفعلي والدخول إليه
          TARGET_DIR=$(find extracted_project -name "build.gradle.kts" -exec dirname {} \; | head -n 1)
          cd "$TARGET_DIR"
          
          # تشغيل البناء مباشرة باستخدام نظام gradle المدمج في البيئة
          gradle assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
