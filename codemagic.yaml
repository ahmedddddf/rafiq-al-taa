workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Build and Assemble APK
        script: |
          unzip -o "rafiq.zip" -d .
          # الدخول للمجلد الداخلي rafiq حيث توجد ملفات الأندرويد الحقيقية
          cd rafiq/rafiq
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
