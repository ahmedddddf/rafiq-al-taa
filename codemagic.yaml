workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Project and Build
        script: |
          # فك ضغط الملف بالكامل
          unzip -o "*.zip" -d extracted_project
          
          # الدخول إلى المجلد الداخلي للمشروع
          cd extracted_project/*
          
          # إعطاء صلاحيات التشغيل وبدء البناء
          chmod +x gradlew || true
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
