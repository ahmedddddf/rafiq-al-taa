workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Auto-Detect Project Root and Build APK
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # 2. البحث التلقائي والديناميكي عن مجلد المشروع الحقيقي الذي يحتوي على gradlew
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
              cd "$(dirname "$GRADLEW_PATH")"
              echo "تم العثور على مسار المشروع بنجاح: $(pwd)"
          else
              echo "تنبيه: لم يتم العثور على ملف gradlew، سيتم المحاولة في المجلد الحالي."
          fi
          
          # 3. منح الصلاحيات وتشغيل بناء الـ APK مباشرة
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
