workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Build Diagnostics APK
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # الدخول للمجلد الداخلي للـ zip
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 2. استخراج أسماء أهم ملفات الـ UI برمجياً وطباعتها بداخل نص متحرك لتظهر لك على شاشة الجوال
          UI_FILES=$(find app/src/main/java/ -name "*.kt" | sed 's|.*/||' | head -n 5 | tr '\n' ' ')
          
          # 3. بناء ملف MainActivity نظيف ومضمون النجاح يعرض الملفات المتوفرة لتكتشف الاسم الصحيح دالتك
          MAIN_ACTIVITY_PATH=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY_PATH" ]; then
              echo "جاري بناء MainActivity تشخيصي ومضمون النجاح..."
              rm -f "$MAIN_ACTIVITY_PATH"
              cat << EOF > "$MAIN_ACTIVITY_PATH"
              package com.example

              import android.os.Bundle
              import androidx.activity.ComponentActivity
              import androidx.activity.compose.setContent
              import androidx.compose.foundation.layout.*
              import androidx.compose.material3.*
              import androidx.compose.runtime.*
              import androidx.compose.ui.Modifier
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.Alignment
              import androidx.compose.ui.text.style.TextAlign

              class MainActivity : ComponentActivity() {
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContent {
                          MaterialTheme {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                      Column(
                                          horizontalAlignment = Alignment.CenterHorizontally,
                                          verticalArrangement = Arrangement.Center,
                                          modifier = Modifier.padding(24.dp)
                                      ) {
                                          Text(
                                              text = "رَفِيقُ الطَّاعَةِ 🎯",
                                              style = MaterialTheme.typography.headlineMedium,
                                              textAlign = TextAlign.Center
                                          )
                                          Spacer(modifier = Modifier.height(16.dp))
                                          Text(
                                              text = "الملفات المكتشفة في مشروعك هي:\n\n$UI_FILES\n\nقم بتصوير هذه الشاشة وأرسلها لي لأعرف اسم دالتك الرئيسية ونربطها فوراً!",
                                              textAlign = TextAlign.Center,
                                              style = MaterialTheme.typography.bodyLarge
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          EOF
          fi
          
          # 4. تهيئة البيئة وتثبيت إصدار الجرادر المتوافق 9.3.1
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 5. توليد ملف التوقيع لضمان تخطي خطأ الـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 6. تشغيل البناء الصافي المضمون
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
