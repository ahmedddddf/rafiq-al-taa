workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Extract Project, Install Gradle and Build
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # 2. الدخول للمجلد الداخلي للمشروع
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 3. تفعيل أداة تثبيت الحزم وتثبيت Gradle برمجياً داخل السيرفر
          echo "جاري تهيئة البيئة وتثبيت Gradle..."
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 8.7
          
          # 4. توليد ملفات الـ Wrapper ومنح الصلاحيات
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          
          # 5. تشغيل بناء الـ APK مباشرة
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
