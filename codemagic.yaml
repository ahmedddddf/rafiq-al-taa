workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Auto-Fix MainActivity and Build APK
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # الدخول للمجلد الداخلي
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 2. تحديد مسار ملف الـ MainActivity وتطهيره تلقائياً من الأكواد المكسورة
          MAIN_ACTIVITY_PATH=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY_PATH" ]; then
              echo "جاري تنظيف وتصليح ملف MainActivity تلقائياً..."
              # حذف الأسطر المسببة للتداخل وإرجاع الملف لوضعه الطبيعي
              sed -i '' '/ReminderBroadcastReceiver/d' "$MAIN_ACTIVITY_PATH" 2>/dev/null || true
              sed -i '' '/EnhancedLibraryScreen/d' "$MAIN_ACTIVITY_PATH" 2>/dev/null || true
              sed -i '' '/modifier = modifier/d' "$MAIN_ACTIVITY_PATH" 2>/dev/null || true
          fi
          
          # 3. تهيئة البيئة وتثبيت إصدار الجرادل المتوافق 9.3.1
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 4. توليد ملف التوقيع لضمان تخطي خطأ الـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 5. تشغيل البناء الصافي والمستقر
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
