workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Ultralight Native App
        script: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/rafiq
          mkdir -p app/src/main/res/layout
          
          # 1. إعداد Gradle خفيف
          cat << 'EOF' > build.gradle
          buildscript { repositories { google(); mavenCentral() } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          # 2. إعداد app/build.gradle بدون مكتبات ثقيلة
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.rafiq'
              compileSdk 34
              defaultConfig { applicationId "com.example.rafiq"; minSdk 21; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          EOF
          
          # 3. إعداد MainActivity خفيف جداً
          cat << 'EOF' > app/src/main/java/com/example/rafiq/MainActivity.java
          package com.example.rafiq;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  TextView tv = new TextView(this);
                  tv.setText("رفيق الطاعة - النسخة الخفيفة");
                  tv.setGravity(17);
                  setContentView(tv);
              }
          }
          EOF
          
          # 4. بناء سريع
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
