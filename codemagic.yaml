workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Build APK Using Gradle
        script: |
          gradle assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - "**/build/outputs/apk/**/*.apk"
