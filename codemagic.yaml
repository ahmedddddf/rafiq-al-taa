workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Extract Project and Install Build Tools
        script: |
          # 1. فك ضغط ملف المشروع المستلم من الجوال
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # 2. الدخول التلقائي للمجلد الداخلي للمشروع
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 3. تثبيت وتوليد ملفات Gradle Wrapper رسمياً داخل السيرفر مباشرة لتفادي الملفات المفقودة
          echo "جاري تثبيت نظام بناء Gradle تلقائياً..."
          gradle wrapper --gradle-version 8.7
          
          # 4. منح الصلاحيات الكاملة وتشغيل بناء التطبيق
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
