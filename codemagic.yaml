workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build with Optimized Dependencies
        script: |
          # 1. تنظيف خفيف
          rm -rf app/build
          
          # 2. بناء سريع جداً باستخدام إعدادات النظام المحملة مسبقاً
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --parallel --offline || ./gradlew assembleDebug --no-daemon
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
