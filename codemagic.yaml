workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Build App with Islamic Theme Colors
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # الدخول للمجلد الداخلي للـ zip
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 2. بناء MainActivity مصلح بالكامل مع لوحة ألوان إسلامية متناسقة ومريحة جداً للعين
          MAIN_ACTIVITY_PATH=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY_PATH" ]; then
              echo "جاري بناء MainActivity.kt وحقن الألوان والتصاميم الروحانية..."
              rm -f "$MAIN_ACTIVITY_PATH"
              cat << 'EOF' > "$MAIN_ACTIVITY_PATH"
              package com.example

              import android.os.Bundle
              import androidx.activity.ComponentActivity
              import androidx.activity.compose.setContent
              import androidx.compose.foundation.clickable
              import androidx.compose.foundation.layout.*
              import androidx.compose.foundation.lazy.LazyColumn
              import androidx.compose.foundation.lazy.itemsIndexed
              import androidx.compose.material.icons.Icons
              import androidx.compose.material.icons.filled.Home
              import androidx.compose.material.icons.filled.Book
              import androidx.compose.material.icons.filled.Notifications
              import androidx.compose.material.icons.filled.ArrowBack
              import androidx.compose.material.icons.filled.Refresh
              import androidx.compose.material3.*
              import androidx.compose.runtime.*
              import androidx.compose.ui.Modifier
              import androidx.compose.ui.graphics.Color
              import androidx.compose.ui.unit.dp
              import androidx.compose.ui.Alignment
              import androidx.compose.ui.text.style.TextAlign

              class MainActivity : ComponentActivity() {
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContent {
                          // تعريف مخصص للألوان الإسلامية المتناسقة
                          val islamicColorScheme = lightColorScheme(
                              primary = Color(0xFF006644),      // أخضر زمردي إسلامي فاخر
                              onPrimary = Color.White,
                              background = Color(0xFFFBF8F3),   // بيج ناعم جداً مريح للقراءة (سكري)
                              surface = Color.White,            // أسطح وكروت بيضاء نظيفة
                              onBackground = Color(0xFF2C3E50), // نصوص داكنة مريحة للقراءة
                              onSurface = Color(0xFF2C3E50)
                          )

                          MaterialTheme(colorScheme = islamicColorScheme) {
                              var selectedTab by remember { mutableStateOf(1) } // فتح المصحف مباشرة لمشاهدة جمال الألوان
                              
                              Scaffold(
                                  bottomBar = {
                                      NavigationBar(containerColor = Color.White) {
                                          NavigationBarItem(
                                              selected = selectedTab == 0,
                                              onClick = { selectedTab = 0 },
                                              icon = { Icon(Icons.Default.Home, contentDescription = "الرئيسية") },
                                              label = { Text("الرئيسية") }
                                          )
                                          NavigationBarItem(
                                              selected = selectedTab == 1,
                                              onClick = { selectedTab = 1 },
                                              icon = { Icon(Icons.Default.Book, contentDescription = "المصحف") },
                                              label = { Text("المصحف") }
                                          )
                                          NavigationBarItem(
                                              selected = selectedTab == 2,
                                              onClick = { selectedTab = 2 },
                                              icon = { Icon(Icons.Default.Notifications, contentDescription = "التذكيرات") },
                                              label = { Text("التذكيرات") }
                                          )
                                      }
                                  }
                              ) { paddingValues ->
                                  Box(
                                      modifier = Modifier
                                          .fillMaxSize()
                                          .padding(paddingValues),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      when (selectedTab) {
                                          0 -> HomeScreen()
                                          1 -> QuranNavigation()
                                          2 -> RemindersScreen()
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              @Composable
              fun HomeScreen() {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      verticalArrangement = Arrangement.Center,
                      modifier = Modifier.padding(24.dp)
                  ) {
                      Text(text = "رَفِيقُ الطَّاعَةِ 🎯", style = MaterialTheme.typography.headlineMedium, color = MaterialTheme.colorScheme.primary, textAlign = TextAlign.Center)
                      Spacer(modifier = Modifier.height(16.dp))
                      Text(text = "مرحباً بك في تطبيقك النظيف والمطور بحزمة الألوان الجديدة!", textAlign = TextAlign.Center, style = MaterialTheme.typography.bodyLarge)
                  }
              }

              @Composable
              fun QuranNavigation() {
                  var selectedSurah by remember { mutableStateOf<String?>(null) }
                  
                  if (selectedSurah == null) {
                      SurahListScreen(onSurahSelect = { selectedSurah = it })
                  } else {
                      SurahDetailScreen(surahName = selectedSurah!!, onBack = { selectedSurah = null })
                  }
              }

              @Composable
              fun SurahListScreen(onSurahSelect: (String) -> Unit) {
                  val allSurahs = listOf(
                      "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
                      "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
                      "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
                      "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
                      "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
                      "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
                      "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
                      "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
                      "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
                      "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
                      "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
                      "المسد", "الإخلاص", "الفلق", "الناس"
                  )
                  
                  Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                      Text(
                          text = "المصحف الشريف 📖",
                          style = MaterialTheme.typography.headlineMedium,
                          color = MaterialTheme.colorScheme.primary,
                          modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp),
                          textAlign = TextAlign.Center
                      )
                      LazyColumn {
                          itemsIndexed(allSurahs) { index, surah ->
                              Card(
                                  colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 4.dp)
                                      .clickable { onSurahSelect(surah) }
                              ) {
                                  Row(
                                      modifier = Modifier.padding(16.dp).fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(text = "سورة رقم ${index + 1}", style = MaterialTheme.typography.bodySmall, color = Color.Gray)
                                      Text(text = surah, style = MaterialTheme.typography.bodyLarge, color = MaterialTheme.colorScheme.onBackground, textAlign = TextAlign.Right)
                                  }
                              }
                          }
                      }
                  }
              }

              @Composable
              fun SurahDetailScreen(surahName: String, onBack: () -> Unit) {
                  val surahText = when(surahName) {
                      "الفاتحة" -> "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ ﴿١﴾ الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ ﴿٢﴾ الرَّحْمَٰنِ الرَّحِيمِ ﴿٣﴾ مَالِكِ يَوْمِ الدِّينِ ﴿٤﴾ إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ ﴿٥﴾ اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ ﴿٦﴾ صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ ﴿٧﴾"
                      "الإخلاص" -> "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ هُوَ اللَّهُ أَحَدٌ ﴿١﴾ اللَّهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾"
                      "الفلق" -> "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خخلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾ وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾"
                      "الناس" -> "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَٰهِ النَّاسِ ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾"
                      "الملك" -> "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ﴿١﴾ الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ ﴿٢﴾"
                      else -> "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\n\nجاري تجهيز نص سورة $surahName كاملاً بالتشكيل في التحديث التدريجي القادم لضمان أداء التطبيق المستقر."
                  }

                  Column(modifier = Modifier.fillMaxSize().padding(16.dp)) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.fillMaxWidth().padding(bottom = 16.dp)
                      ) {
                          IconButton(onClick = onBack) {
                              Icon(Icons.Default.ArrowBack, contentDescription = "رجوع", tint = MaterialTheme.colorScheme.primary)
                          }
                          Spacer(modifier = Modifier.weight(1f))
                          Text(text = "سورة $surahName", style = MaterialTheme.typography.headlineSmall, color = MaterialTheme.colorScheme.primary)
                      }
                      
                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          modifier = Modifier.fillMaxSize()
                      ) {
                          LazyColumn(modifier = Modifier.padding(16.dp)) {
                              item {
                                  Text(
                                      text = surahText,
                                      style = MaterialTheme.typography.bodyLarge,
                                      color = MaterialTheme.colorScheme.onBackground,
                                      textAlign = TextAlign.Center,
                                      modifier = Modifier.fillMaxWidth(),
                                      lineHeight = MaterialTheme.typography.bodyLarge.lineHeight * 1.6f
                                  )
                              }
                          }
                      }
                  }
              }

              @Composable
              fun RemindersScreen() {
                  var istighfarCount by remember { mutableStateOf(0) }
                  var salawatCount by remember { mutableStateOf(0) }

                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.fillMaxSize().padding(16.dp)
                  ) {
                      Text(
                          text = "أَذْكَارُ وَتَذْكِيرَاتٌ 🔔",
                          style = MaterialTheme.typography.headlineMedium,
                          color = MaterialTheme.colorScheme.primary,
                          modifier = Modifier.padding(bottom = 24.dp),
                          textAlign = TextAlign.Center
                      )

                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)
                      ) {
                          Column(
                              modifier = Modifier.padding(16.dp).fillMaxWidth(),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(text = "أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ وَأَتُوبُ إِلَيْهِ", style = MaterialTheme.typography.titleLarge, color = MaterialTheme.colorScheme.onBackground, textAlign = TextAlign.Center)
                              Spacer(modifier = Modifier.height(12.dp))
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.Center,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Button(
                                      onClick = { istighfarCount++ },
                                      colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)
                                  ) {
                                      Text(text = "العَدّ: $istighfarCount", color = Color.White)
                                  }
                                  Spacer(modifier = Modifier.width(16.dp))
                                  IconButton(onClick = { istighfarCount = 0 }) {
                                      Icon(Icons.Default.Refresh, contentDescription = "تصفير", tint = Color.Gray)
                                  }
                              }
                          }
                      }

                      Card(
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                          modifier = Modifier.fillMaxWidth().padding(vertical = 8.dp)
                      ) {
                          Column(
                              modifier = Modifier.padding(16.dp).fillMaxWidth(),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(text = "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَى نَبِيِّنَا مُحَمَّدٍ", style = MaterialTheme.typography.titleLarge, color = MaterialTheme.colorScheme.onBackground, textAlign = TextAlign.Center)
                              Spacer(modifier = Modifier.height(12.dp))
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.Center,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Button(
                                      onClick = { salawatCount++ },
                                      colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.primary)
                                  ) {
                                      Text(text = "العَد: $salawatCount", color = Color.White)
                                  }
                                  Spacer(modifier = Modifier.width(16.dp))
                                  IconButton(onClick = { salawatCount = 0 }) {
                                      Icon(Icons.Default.Refresh, contentDescription = "تصفير", tint = Color.Gray)
                                  }
                              }
                          }
                      }
                  }
              }
          EOF
          fi
          
          # 3. تهيئة البيئة وتثبيت إصدار الجرادر المتوافق 9.3.1
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 4. توليد ملف التوقيع لضمان تخطي خطأ الـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 5. تشغيل البناء المستقر للألوان الفاخرة
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
