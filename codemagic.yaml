workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Ultralight Native App
        script: |
          rm -rf *
          # 1. إعداد هيكل المشروع
          mkdir -p app/src/main/java/com/example/rafiq
          
          # 2. إنشاء build.gradle الأساسي
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat << 'EOF' > settings.gradle
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.rafiq'
              compileSdk 34
              defaultConfig { applicationId "com.example.rafiq"; minSdk 21; targetSdk 34 }
          }
          EOF
          
          # 3. توليد ملف gradlew وتهيئته
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          
          # 4. بناء التطبيق
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
