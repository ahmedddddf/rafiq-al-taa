workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Inject Imports into Original App and Build
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # الدخول للمجلد الداخلي للـ zip
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 2. البحث عن ملف MainActivity.kt الأصلي وحقن حزم الـ Imports المفقودة في أعلاه لحل الأخطاء تماماً
          MAIN_ACTIVITY_PATH=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY_PATH" ]; then
              echo "جاري تكييف وإصلاح ملف MainActivity.kt الأصلي وتلقيم الحزم المفقودة..."
              
              # إنشاء ملف مؤقت لإضافة الحزم اللازمة للإشعارات والسياق في بداية الملف
              cat << 'EOF' > temp_imports.txt
              package com.example

              import android.content.Context
              import android.content.Intent
              import com.example.ui.ReminderBroadcastReceiver
          EOF
              
              # دمج الـ Imports الجديدة مع كود ملفك الأصلي المخزن في الـ zip
              tail -n +2 "$MAIN_ACTIVITY_PATH" >> temp_imports.txt
              mv temp_imports.txt "$MAIN_ACTIVITY_PATH"
          fi
          
          # 3. تهيئة البيئة وتثبيت إصدار الجرادل المتوافق 9.3.1
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 4. توليد ملف التوقيع لضمان تخطي خطأ الـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 5. تشغيل البناء المستقر للتطبيق النظيف الخاص بك
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
