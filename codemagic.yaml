workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Auto-Detect UI and Build Real App
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # الدخول للمجلد الداخلي للـ zip
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 2. البحث تلقائياً عن اسم دالة الملاحة أو الواجهة الرئيسية في ملفات الـ UI الخاصة بك
          REAL_NAV_FUNCTION=$(grep -rE '@Composable.*Screen|@Composable.*App|@Composable.*Main' app/src/main/java/ | grep -v 'MainActivity' | head -n 1 | sed -n 's/.*fun \([a-zA-Z0-9_]*\).*/\1/p')
          REAL_NAV_PACKAGE=$(find app/src/main/java/ -name "*.kt" | xargs grep -l "fun $REAL_NAV_FUNCTION" | head -n 1 | sed 's|.*java/||' | sed 's|/[^/]*$||' | tr '/' '.')
          
          # إذا لم يجدها آلياً، نضع قيم افتراضية آمنة
          if [ -z "$REAL_NAV_FUNCTION" ]; then
              REAL_NAV_FUNCTION="MainScreen"
              REAL_NAV_PACKAGE="com.example.ui"
          fi
          
          # 3. إعادة بناء الـ MainActivity وربطه بالدالة الحقيقية المستخرجة تلقائياً من مشروعك
          MAIN_ACTIVITY_PATH=$(find . -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_ACTIVITY_PATH" ]; then
              echo "جاري ربط MainActivity بدالة العرض الحقيقية: $REAL_NAV_PACKAGE.$REAL_NAV_FUNCTION"
              rm -f "$MAIN_ACTIVITY_PATH"
              cat << EOF > "$MAIN_ACTIVITY_PATH"
              package com.example

              import android.os.Bundle
              import androidx.activity.ComponentActivity
              import androidx.activity.compose.setContent
              import androidx.compose.foundation.layout.fillMaxSize
              import androidx.compose.material3.MaterialTheme
              import androidx.compose.material3.Surface
              import androidx.compose.ui.Modifier
              import ${REAL_NAV_PACKAGE}.${REAL_NAV_FUNCTION}

              class MainActivity : ComponentActivity() {
                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      setContent {
                          MaterialTheme {
                              Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                                  // تشغيل واجهتك الحقيقية والأصلية مباشرة هنا
                                  ${REAL_NAV_FUNCTION}()
                              }
                          }
                      }
                  }
              }
          EOF
          fi
          
          # 4. تهيئة البيئة وتثبيت إصدار الجرادر المتوافق 9.3.1
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 5. توليد ملف التوقيع لضمان تخطي خطأ الـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 6. تشغيل البناء المستقر للنسخة الكاملة
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
