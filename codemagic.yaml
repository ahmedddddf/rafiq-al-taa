workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Build Original Base App
        script: |
          # 1. فك ضغط المشروع الأصلي كما هو
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          if [ -d "rafiq" ]; then cd rafiq; fi
          
          # 2. تهيئة بيئة الجرادر والتصاريح الأساسية
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 3. تخطي خطأ التوقيع والـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 4. تشغيل بناء التطبيق الأصلي النظيف
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
