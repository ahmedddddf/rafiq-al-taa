workflows:
  android-workflow:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
    scripts:
      - name: Extract Project, Clean Cache and Build
        script: |
          # 1. فك ضغط ملف المشروع
          unzip -o "rafiq.zip" -d extracted_project
          cd extracted_project
          
          # 2. الدخول للمجلد الداخلي للمشروع
          if [ -d "rafiq" ]; then
              cd rafiq
          fi
          
          # 3. استرجاع ملف MainActivity.kt الأصلي النظيف وتصفير أي تعديل خاطئ قديم
          git checkout -- app/src/main/java/com/example/MainActivity.kt 2>/dev/null || true
          
          # 4. تثبيت الإصدار الحديث المتوافق 9.3.1 وتوليد الـ Wrapper
          [[ -s "$HOME/.sdkman/bin/sdkman-init.sh" ]] && source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install gradle 9.3.1
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 5. توليد ملف التوقيع وتوزيعه في كل المسارات المحتملة لحل خطأ الـ Keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore 2>/dev/null || true
          
          # 6. تنظيف كاش الجرادل وتشغيل البناء النظيف المستقر
          ./gradlew clean
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
